[package]
name = "s3sync"
version = "0.5.0"
edition = "2021"

[lib]
name = "s3sync"
path = "src/lib.rs"

[[bin]]
name = "s3sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aws-config = { version = "1.6", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.82"
aws-types = "1.3"
chrono = "0.4"
dirs = "5.0"
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34.1"
env_logger = "0.11"
futures = "0.3"
glob = "0.3"
keyring = { version = "3.6", features = ["windows-native", "linux-native"] }
log = "0.4"
native-dialog = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.28", features = ["full"] }
walkdir = "2.3"
aws-credential-types = "1.2"

[dev-dependencies]
tempfile = "3.3"
mockall = "0.13"

[build-dependencies]
winres = "0.1.12"
